    <style>
      :root {
        --green: #296241;
        --cream: #fdf6ec;
        --amber: #fda11d;
        --leaf: #7fa66b;
        --dark: #173e2a;
        --ink: #173e2a;
        --soft: #f4dfbd;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--cream);
      }

      svg {
        display: none;
        width: 1080px;
        height: 1350px;
        background: var(--cream);
      }

      body[data-slide="1"] #slide-1,
      body[data-slide="2"] #slide-2,
      body[data-slide="3"] #slide-3,
      body[data-slide="4"] #slide-4,
      body[data-slide="5"] #slide-5,
      body[data-slide="6"] #slide-6 {
        display: block;
      }

      .stroke {
        stroke: var(--ink);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .thin {
        stroke-width: 8;
      }

      .mini {
        stroke-width: 5;
      }

      .title {
        font-family: "Arial Rounded MT Bold", "Avenir Next", Arial, sans-serif;
        font-weight: 900;
      }

      .label {
        font-family: "Avenir Next", Arial, sans-serif;
        font-weight: 800;
      }

      .small {
        font-family: "Avenir Next", Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </head>
